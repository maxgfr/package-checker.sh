name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Update Vulnerability Feeds"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install -g \
            semantic-release@25.0.9 \
            @semantic-release/changelog@7.0.0 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/github@12.0.9 \
            conventional-changelog-conventionalcommits@8.0.0

      - name: Verify release tooling
        run: node tests/test_release_notes.mjs "$(npm root -g)"

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The exec success hook sets the outputs only after publication.
          echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          npx --no-install semantic-release

  docker-release:
    name: Build and Push Docker Images
    needs: release
    # Only run if a new release was actually published
    if: ${{ needs.release.outputs.new_release_published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        include:
          # Built once, pushed under both names: "-all" is kept for users
          # pinned to the former all-ecosystems image name.
          - dockerfile: Dockerfile
            suffix: ""
            alias_suffix: "-all"
            feed_ecosystems: "all"
            description: "Full version with GHSA and OSV feeds for all supported ecosystems"
          - dockerfile: Dockerfile.lite
            suffix: "-lite"
            alias_suffix: ""
            feed_ecosystems: "npm"
            description: "Lightweight version without vulnerability data (~27MB)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository }}${{ matrix.suffix }}
            ${{ matrix.alias_suffix && format('ghcr.io/{0}{1}', github.repository, matrix.alias_suffix) || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=package-checker.sh${{ matrix.suffix }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ needs.release.outputs.new_release_version }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
            FEED_ECOSYSTEMS=${{ matrix.feed_ecosystems }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (alias image)
        if: matrix.alias_suffix != ''
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ github.repository }}${{ matrix.alias_suffix }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

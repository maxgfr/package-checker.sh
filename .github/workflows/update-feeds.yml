name: Update Vulnerability Feeds

on:
  schedule:
    # Run every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allow manual trigger via GitHub UI

permissions:
  contents: write # Required for committing changes

# Two runs must not race to push feeds (scheduled + manual trigger).
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Prevent hanging workflows (12 ecosystems: GHSA clone + 12 OSV zips)

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 10 # Enough to rebase the feed commit onto a newer main
          # Upstream advisory data is processed before the push: keep the
          # write token out of .git/config until the push step needs it.
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl unzip git
          echo "✓ Dependencies installed"

      - name: Generate vulnerability feeds
        run: |
          echo "Starting feed generation..."
          chmod +x script.sh
          ./script.sh --fetch-all
          echo "✓ Feed generation complete"

      - name: Guard against truncated feeds
        run: |
          # A feed losing more than 20% of its lines means a broken upstream
          # download or parse, not real churn: keep the committed feeds.
          status=0
          for f in data/*.purl; do
            [ -e "$f" ] || continue
            old=$(git show "HEAD:$f" 2>/dev/null | wc -l | tr -d ' ') || old=0
            new=$(wc -l < "$f" | tr -d ' ')
            if [ "$old" -gt 0 ] && [ $((new * 100)) -lt $((old * 80)) ]; then
              echo "❌ $f shrank from $old to $new lines (more than 20%)"
              status=1
            fi
          done
          exit "$status"

      - name: Collect statistics
        id: stats
        run: |
          OSV_COUNT=0
          GHSA_COUNT=0
          TOTAL=0

          echo "📊 Per-feed statistics:"
          for f in data/*.purl; do
            [ -e "$f" ] || continue
            c=$(wc -l < "$f" | tr -d ' ')
            TOTAL=$((TOTAL + c))
            case "$(basename "$f")" in
              osv*) OSV_COUNT=$((OSV_COUNT + c)) ;;
              ghsa*) GHSA_COUNT=$((GHSA_COUNT + c)) ;;
            esac
            printf '  %-28s %s\n' "$(basename "$f")" "$c"
          done
          echo "  ----------------------------------------"
          printf '  %-28s %s\n' "TOTAL" "$TOTAL"

          {
            echo "osv_count=$OSV_COUNT"
            echo "ghsa_count=$GHSA_COUNT"
            echo "total_count=$TOTAL"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke-test the new feeds
        # A feed that parses but no longer detects known findings must not
        # be committed (and released). The fixtures pin vulnerable versions.
        run: |
          status=0
          ./script.sh test-fixtures/npm-project --no-config --default-source-ghsa-osv > npm.log 2>&1 || status=$?
          if [ "$status" -ne 1 ] || ! grep -q 'next@16.0.3' npm.log; then
            tail -n 30 npm.log; echo "❌ npm fixture not flagged with the new feeds (exit $status)"; exit 1
          fi
          status=0
          ./script.sh test-fixtures/polyglot-project --no-config --default-source-ghsa > poly.log 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            tail -n 30 poly.log; echo "❌ polyglot fixture not flagged with the new feeds (exit $status)"; exit 1
          fi
          rm -f npm.log poly.log
          echo "✓ New feeds detect the fixture vulnerabilities"

      - name: Check for changes
        id: check_changes
        run: |
          # Untracked files count too: a newly added ecosystem feed.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No changes detected in feeds"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "✓ Changes detected in feeds"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          COMMIT_MSG="fix: update vulnerability feeds - $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)

          📊 Feed Statistics:
          - OSV:   ${{ steps.stats.outputs.osv_count }} vulnerabilities
          - GHSA:  ${{ steps.stats.outputs.ghsa_count }} vulnerabilities
          - Total: ${{ steps.stats.outputs.total_count }} vulnerabilities (all ecosystems)

          🤖 Generated by GitHub Actions"

          git commit -m "$COMMIT_MSG"

          # Retry push with rebase if needed (handles concurrent workflow runs)
          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push; then
              echo "✓ Changes committed and pushed successfully"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⚠️  Push failed (attempt $RETRY_COUNT/$MAX_RETRIES), rebasing..."

              git pull --rebase origin main

              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Report status
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "✓ Feeds are up to date, no commit needed"
          echo "📊 Current totals: ${{ steps.stats.outputs.total_count }} vulnerabilities"

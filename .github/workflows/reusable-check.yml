name: Reusable Package Vulnerability Check

on:
  workflow_call:
    inputs:
      use-ghsa:
        description: "Use the built-in GHSA feeds (every detected ecosystem)"
        required: false
        type: boolean
        default: true
      use-osv:
        description: "Use the built-in OSV feeds (every detected ecosystem)"
        required: false
        type: boolean
        default: false
      source:
        description: "Vulnerability source URL or path (JSON or CSV). For multiple sources, use the 'sources' input instead."
        required: false
        type: string
      sources:
        description: "Multiple vulnerability sources (one per line). Each line should be a URL or path. Takes precedence over 'source' input."
        required: false
        type: string
      source-format:
        description: "Format of the last custom source (json, csv, purl, sarif, sbom-cyclonedx, trivy-json; auto-detected if not specified)"
        required: false
        type: string
        default: ""
      csv-columns:
        description: 'CSV column mapping (e.g., "name,versions" or "1,2")'
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory to scan (default: current directory)"
        required: false
        type: string
        default: "."
      fail-on-vulnerabilities:
        description: "Fail the workflow if vulnerabilities are found"
        required: false
        type: boolean
        default: true
      script-version:
        description: "Version or branch of the script to use (default: main)"
        required: false
        type: string
        default: "main"
      additional-args:
        description: "Additional arguments to pass to the script"
        required: false
        type: string
        default: ""
      only-package-json:
        description: "Scan only package.json files (skip lockfiles)"
        required: false
        type: boolean
        default: false
      only-lockfiles:
        description: "Scan only lockfiles (skip package.json files)"
        required: false
        type: boolean
        default: false
      lockfile-types:
        description: "Comma-separated list of lockfile types to scan (npm, yarn, pnpm, bun, deno, python, go, rust, ruby, php, maven, nuget, dart, hex, swift, actions)"
        required: false
        type: string
        default: ""
    secrets:
      github-token:
        description: "GitHub token for accessing private repositories (optional)"
        required: false

jobs:
  check-vulnerabilities:
    name: Check for Vulnerable Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Downloaded outside the workspace: the script looks for feeds in a
      # data/ folder next to itself, which must not be the scanned repo's.
      - name: Download package-checker script
        env:
          SCRIPT_VERSION: ${{ inputs.script-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/package-checker"
          curl -fsSL "https://raw.githubusercontent.com/maxgfr/package-checker.sh/${SCRIPT_VERSION}/script.sh" -o "$RUNNER_TEMP/package-checker/package-checker.sh"
          chmod +x "$RUNNER_TEMP/package-checker/package-checker.sh"

      - name: Run vulnerability check
        id: vuln-check
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          # Inputs reach the shell as data, never as script text.
          INPUT_USE_GHSA: ${{ inputs.use-ghsa }}
          INPUT_USE_OSV: ${{ inputs.use-osv }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_SOURCE_FORMAT: ${{ inputs.source-format }}
          INPUT_CSV_COLUMNS: ${{ inputs.csv-columns }}
          INPUT_ONLY_PACKAGE_JSON: ${{ inputs.only-package-json }}
          INPUT_ONLY_LOCKFILES: ${{ inputs.only-lockfiles }}
          INPUT_LOCKFILE_TYPES: ${{ inputs.lockfile-types }}
          INPUT_ADDITIONAL_ARGS: ${{ inputs.additional-args }}
          INPUT_FAIL_ON_VULNERABILITIES: ${{ inputs.fail-on-vulnerabilities }}
        run: |
          args=()

          # Built-in feeds for every detected ecosystem (not only npm)
          if [ "$INPUT_USE_GHSA" = "true" ] && [ "$INPUT_USE_OSV" = "true" ]; then
            echo "Using built-in GHSA and OSV feeds"
            args+=(--default-source-ghsa-osv)
          elif [ "$INPUT_USE_GHSA" = "true" ]; then
            echo "Using built-in GHSA feed"
            args+=(--default-source-ghsa)
          elif [ "$INPUT_USE_OSV" = "true" ]; then
            echo "Using built-in OSV feed"
            args+=(--default-source-osv)
          fi

          # Multiple sources, one per line
          custom=0
          while IFS= read -r source_url; do
            if [ -n "$source_url" ]; then
              args+=(--source "$source_url")
              custom=1
            fi
          done <<< "$INPUT_SOURCES"

          if [ -n "$INPUT_SOURCE" ]; then
            echo "Using single source from 'source' input"
            args+=(--source "$INPUT_SOURCE")
            custom=1
          fi

          if [ ${#args[@]} -eq 0 ]; then
            echo "Error: No vulnerability source provided. Use one of:"
            echo "  - use-ghsa: true"
            echo "  - use-osv: true"
            echo "  - source: <url-or-path>"
            echo "  - sources: <multiple-urls-or-paths>"
            exit 2
          fi

          # -f and --csv-columns qualify the last --source
          if [ "$custom" = 1 ] && [ -n "$INPUT_SOURCE_FORMAT" ]; then
            args+=(--format "$INPUT_SOURCE_FORMAT")
          fi
          if [ "$custom" = 1 ] && [ -n "$INPUT_CSV_COLUMNS" ]; then
            args+=(--csv-columns "$INPUT_CSV_COLUMNS")
          fi

          if [ "$INPUT_ONLY_PACKAGE_JSON" = "true" ]; then
            echo "Scanning only package.json files"
            args+=(--only-package-json)
          fi
          if [ "$INPUT_ONLY_LOCKFILES" = "true" ]; then
            echo "Scanning only lockfiles"
            args+=(--only-lockfiles)
          fi
          if [ -n "$INPUT_LOCKFILE_TYPES" ]; then
            echo "Filtering lockfile types: $INPUT_LOCKFILE_TYPES"
            args+=(--lockfile-types "$INPUT_LOCKFILE_TYPES")
          fi

          if [ -n "$INPUT_ADDITIONAL_ARGS" ]; then
            read -ra extra_args <<< "$INPUT_ADDITIONAL_ARGS"
            args+=("${extra_args[@]}")
          fi

          args+=(--export-json vulnerability-report.json --export-csv vulnerability-report.csv)

          echo "Running: package-checker.sh ${args[*]}"

          # Exit codes: 0 clean, 1 vulnerable packages, 2 error. An error
          # always fails the job; findings only when requested.
          status=0
          "$RUNNER_TEMP/package-checker/package-checker.sh" "${args[@]}" || status=$?
          if [ "$status" -eq 1 ] && [ "$INPUT_FAIL_ON_VULNERABILITIES" != "true" ]; then
            echo "Vulnerabilities found but not failing the build"
            exit 0
          fi
          exit "$status"

      - name: Upload results (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-results
          path: |
            ${{ inputs.working-directory }}/vulnerability-report.json
            ${{ inputs.working-directory }}/vulnerability-report.csv
          if-no-files-found: ignore

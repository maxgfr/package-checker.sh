name: Build and Push Docker Images (Development)

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Update Vulnerability Feeds"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Overlapping runs (a push and a feed refresh) are queued, never run in
# parallel, so an older build cannot overwrite the "dev" tag after a newer
# one; nothing is cancelled (a run that ends up skipping must not cancel a
# real build).
concurrency:
  group: docker-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip release commits (release.yml handles Docker) and failed workflow_run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(release):'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        include:
          # Built once, pushed under both names: "-all" is kept for users
          # pinned to the former all-ecosystems image name.
          - dockerfile: Dockerfile
            suffix: ""
            alias_suffix: "-all"
            feed_ecosystems: "all"
            description: "Full version with GHSA and OSV feeds for all supported ecosystems"
          - dockerfile: Dockerfile.lite
            suffix: "-lite"
            alias_suffix: ""
            feed_ecosystems: "npm"
            description: "Lightweight version without vulnerability data (~27MB)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A feed refresh that found nothing new pushes no commit: main is still
      # the commit the refresh ran on, and its images are already published.
      - name: Detect an unchanged feed refresh
        id: unchanged
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_run ] && [ "$(git rev-parse HEAD)" = "$RUN_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commit since the feed refresh started: nothing to rebuild"
          fi

      - name: Set up Docker Buildx
        if: steps.unchanged.outputs.skip != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        if: steps.unchanged.outputs.skip != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.unchanged.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
            ${{ matrix.alias_suffix && format('{0}/{1}{2}', env.REGISTRY, env.IMAGE_NAME, matrix.alias_suffix) || '' }}
          # "latest" belongs to release.yml: pushing it here raced with releases.
          tags: |
            type=ref,event=branch
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=package-checker.sh${{ matrix.suffix }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        if: steps.unchanged.outputs.skip != 'true'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=dev
            FEED_ECOSYSTEMS=${{ matrix.feed_ecosystems }}

      - name: Generate artifact attestation
        if: steps.unchanged.outputs.skip != 'true'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (alias image)
        if: steps.unchanged.outputs.skip != 'true' && matrix.alias_suffix != ''
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.alias_suffix }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

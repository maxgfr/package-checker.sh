name: Test Package Checker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fixtures:
    name: Fixtures (${{ matrix.os }}, ${{ matrix.awk }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, awk: gawk}
          - {os: ubuntu-latest, awk: mawk}
          - {os: macos-latest, awk: awk}
          - {os: macos-latest, awk: gawk}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install test tools
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            brew install bash gawk jq shellcheck
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y gawk mawk jq shellcheck
          fi
      - name: Select awk implementation
        run: |
          mkdir -p "$RUNNER_TEMP/checker-bin"
          ln -s "$(command -v ${{ matrix.awk }})" "$RUNNER_TEMP/checker-bin/awk"
          echo "$RUNNER_TEMP/checker-bin" >> "$GITHUB_PATH"
      - name: Run offline checks
        run: bash tests/run.sh

  test-docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lite: Dockerfile.lite; full: Dockerfile default; all / npm:
        # FEED_ECOSYSTEMS build-arg (see tests/test-docker.sh)
        variant: [lite, full, all, npm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and check the image
        # The same script the local Docker check runs, one variant per job.
        run: bash tests/test-docker.sh '${{ matrix.variant }}'

  verify-build:
    name: Verify script.sh matches src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rebuild from src
        run: bash build.sh
      - name: Check for drift
        run: |
          if ! git diff --exit-code script.sh; then
            echo ""
            echo "ERROR: script.sh does not match src/."
            echo "Someone edited script.sh directly, or forgot to run ./build.sh after editing src/."
            echo "Fix: run ./build.sh and commit the result together with your src/ changes."
            exit 1
          fi

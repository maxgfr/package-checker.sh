name: Test Package Checker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-fixtures:
    name: Fixtures (${{ matrix.os }}, ${{ matrix.awk }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, awk: gawk}
          - {os: ubuntu-latest, awk: mawk}
          - {os: macos-latest, awk: awk}
          - {os: macos-latest, awk: gawk}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            brew install bash gawk jq shellcheck
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y gawk mawk jq shellcheck
          fi
      - name: Select awk implementation
        run: |
          mkdir -p "$RUNNER_TEMP/checker-bin"
          ln -s "$(command -v ${{ matrix.awk }})" "$RUNNER_TEMP/checker-bin/awk"
          echo "$RUNNER_TEMP/checker-bin" >> "$GITHUB_PATH"
      - name: Run offline checks
        run: bash tests/run.sh

  test-docker:
    name: Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: lite, dockerfile: Dockerfile.lite, ecosystems: npm}
          - {variant: full, dockerfile: Dockerfile, ecosystems: npm}
          - {variant: all, dockerfile: Dockerfile, ecosystems: all}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f '${{ matrix.dockerfile }}' --build-arg FEED_ECOSYSTEMS='${{ matrix.ecosystems }}' -t checker:test .
      - name: Scan fixtures without jq
        run: |
          docker run --rm --entrypoint sh checker:test -c '! command -v jq'
          status=0
          output=$(docker run --rm -v "$PWD/test-fixtures:/fixtures:ro" checker:test /fixtures/npm-project --source /fixtures/test-vulnerabilities.json) || status=$?
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -q 'next@16.0.3'
          docker run --rm -v "$PWD/test-fixtures:/fixtures:ro" checker:test /fixtures/safe-project --source /fixtures/test-vulnerabilities.json
      - name: Check bundled feeds
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm -e VARIANT --entrypoint sh checker:test -c '
            case "$VARIANT" in
              lite) test ! -d /app/data ;;
              full) test -f /app/data/ghsa.purl && test -f /app/data/osv.purl && test ! -f /app/data/ghsa-cargo.purl ;;
              all)
                for eco in pypi golang cargo gem composer maven nuget pub hex swift githubactions; do
                  test -f "/app/data/ghsa-$eco.purl" && test -f "/app/data/osv-$eco.purl" || exit 1
                done ;;
            esac'

  verify-build:
    name: Verify script.sh matches src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from src
        run: bash build.sh
      - name: Check for drift
        run: |
          if ! git diff --exit-code script.sh; then
            echo ""
            echo "ERROR: script.sh does not match src/."
            echo "Someone edited script.sh directly, or forgot to run ./build.sh after editing src/."
            echo "Fix: run ./build.sh and commit the result together with your src/ changes."
            exit 1
          fi
